<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>%VITE_SITE_TITLE%</title>
    <meta name="description" content="%VITE_SITE_DESCRIPTION%" />
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <meta name="theme-color" content="#5b3eff" />

    <link rel="icon" type="image/png" sizes="32x32" href="/avatar.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/avatar.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/avatar.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%VITE_PROFILE_NAME%" />
    <meta property="og:title" content="%VITE_SITE_TITLE%" />
    <meta property="og:description" content="%VITE_SITE_DESCRIPTION%" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_OG_IMAGE%" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_SITE_TITLE%" />
    <meta name="twitter:description" content="%VITE_SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%VITE_OG_IMAGE%" />

    <!-- Self-hosted fonts (local woff2, preloaded; no render-blocking external CSS) -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/hanken-grotesk-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/bricolage-grotesque-latin.woff2" />

    <style>
      /* Self-hosted fonts — declared inline so they are ready for the first
         paint (the static skeleton content below renders with the real fonts). */
      @font-face {
        font-family: 'Bricolage Grotesque';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/fonts/bricolage-grotesque-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Hanken Grotesk';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/hanken-grotesk-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* Skeleton overlay — static HTML OUTSIDE #root so its text paints at
         first contentful paint (no JS dependency) and is not wiped by React.
         It is removed by the app after a short delay. The CTA heading/text
         below is the REAL content: the largest text on the page (LCP element),
         pre-rendered so LCP happens at first paint instead of after the JS
         bundle executes. Inline styles keep the box identical to the real
         section (same wrap → same size → no LCP re-fire on swap). */
      #vd-skeleton {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 640px;
        margin: 0 auto;
        padding: 64px 20px 0;
        z-index: 1;
      }
      @media (min-width: 640px) {
        #vd-skeleton {
          padding-top: 96px;
        }
      }
      #vd-skeleton .vd-skeleton-cta-text {
        width: calc(100% + 40px);
        margin: 56px -20px 0;
        text-align: center;
      }
      #vd-skeleton .vd-skeleton-cta-text h2 {
        margin: 0;
        font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: #ffffff;
      }
      #vd-skeleton .vd-skeleton-cta-text p {
        margin: 8px 0 0;
        font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif;
        font-size: 15px;
        line-height: 24px;
        color: rgba(255, 255, 255, 0.85);
      }
      #vd-skeleton .vd-skeleton {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        background-color: rgba(255, 255, 255, 0.12);
      }
      #vd-skeleton .vd-skeleton::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
        animation: vd-shimmer 1.5s infinite;
      }
      @keyframes vd-shimmer {
        100% {
          transform: translateX(100%);
        }
      }
      #vd-skeleton .vd-skeleton-avatar {
        width: 96px;
        height: 96px;
        border-radius: 9999px;
      }
      #vd-skeleton .vd-skeleton-title {
        width: 180px;
        height: 32px;
        margin-top: 20px;
        border-radius: 8px;
      }
      #vd-skeleton .vd-skeleton-subtitle {
        width: 220px;
        height: 16px;
        margin-top: 12px;
      }
      #vd-skeleton .vd-skeleton-line {
        width: 100%;
        max-width: 448px;
        height: 14px;
        margin-top: 12px;
      }
      #vd-skeleton .vd-skeleton-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 48px;
      }
      #vd-skeleton .vd-skeleton-circle {
        width: 56px;
        height: 56px;
        border-radius: 9999px;
      }
      /* Cards & social circles are solid white (mirror the real components) */
      #vd-skeleton .vd-skeleton-card,
      #vd-skeleton .vd-skeleton-circle {
        background-color: #ffffff;
      }
      #vd-skeleton .vd-skeleton-card::after,
      #vd-skeleton .vd-skeleton-circle::after {
        background: linear-gradient(90deg, transparent, rgba(91, 62, 255, 0.18), transparent);
      }
      #vd-skeleton .vd-skeleton-card {
        width: 100%;
        height: 76px;
        margin-top: 12px;
      }
      @media (prefers-reduced-motion: reduce) {
        #vd-skeleton .vd-skeleton::after {
          animation: none;
        }
      }
      @media (prefers-color-scheme: dark) {
        #vd-skeleton .vd-skeleton {
          background-color: rgba(255, 255, 255, 0.1);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Static skeleton overlay (outside #root): paints at first paint, removed by the app. -->
    <div id="vd-skeleton" class="vd-skeleton-page" aria-hidden="true">
      <div class="vd-skeleton vd-skeleton-avatar"></div>
      <div class="vd-skeleton vd-skeleton-title"></div>
      <div class="vd-skeleton vd-skeleton-subtitle"></div>
      <div class="vd-skeleton vd-skeleton-line"></div>
      <div class="vd-skeleton vd-skeleton-line"></div>
      <div class="vd-skeleton-row">
        <div class="vd-skeleton vd-skeleton-circle"></div>
        <div class="vd-skeleton vd-skeleton-circle"></div>
        <div class="vd-skeleton vd-skeleton-circle"></div>
        <div class="vd-skeleton vd-skeleton-circle"></div>
      </div>
      <div class="vd-skeleton vd-skeleton-card"></div>
      <div class="vd-skeleton vd-skeleton-card"></div>
      <div class="vd-skeleton-cta-text">
        <h2>Punya proyek atau ide?</h2>
        <p>Mari wujudkan bersama — dari konsep, desain, hingga peluncuran.</p>
      </div>
      <div class="vd-skeleton vd-skeleton-card"></div>
      <div class="vd-skeleton vd-skeleton-card"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
