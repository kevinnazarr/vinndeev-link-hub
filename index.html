<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>%VITE_SITE_TITLE%</title>
    <meta name="description" content="%VITE_SITE_DESCRIPTION%" />
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <meta name="theme-color" content="#5b3eff" />

    <link rel="icon" type="image/png" sizes="32x32" href="/avatar.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/avatar.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/avatar.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%VITE_PROFILE_NAME%" />
    <meta property="og:title" content="%VITE_SITE_TITLE%" />
    <meta property="og:description" content="%VITE_SITE_DESCRIPTION%" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_OG_IMAGE%" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_SITE_TITLE%" />
    <meta name="twitter:description" content="%VITE_SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%VITE_OG_IMAGE%" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Skeleton shown until React mounts; replaced by app content. */
      #root .vd-skeleton-page {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 640px;
        margin: 0 auto;
        padding: 64px 20px 0;
      }
      @media (min-width: 640px) {
        #root .vd-skeleton-page {
          padding-top: 96px;
        }
      }
      #root .vd-skeleton {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        background-color: rgba(255, 255, 255, 0.12);
      }
      #root .vd-skeleton::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
        animation: vd-shimmer 1.5s infinite;
      }
      @keyframes vd-shimmer {
        100% {
          transform: translateX(100%);
        }
      }
      #root .vd-skeleton-avatar {
        width: 96px;
        height: 96px;
        border-radius: 9999px;
      }
      #root .vd-skeleton-title {
        width: 180px;
        height: 32px;
        margin-top: 20px;
        border-radius: 8px;
      }
      #root .vd-skeleton-subtitle {
        width: 220px;
        height: 16px;
        margin-top: 12px;
      }
      #root .vd-skeleton-line {
        width: 100%;
        max-width: 448px;
        height: 14px;
        margin-top: 12px;
      }
      #root .vd-skeleton-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 48px;
      }
      #root .vd-skeleton-circle {
        width: 56px;
        height: 56px;
        border-radius: 9999px;
      }
      /* Cards & social circles are solid white (mirror the real components) */
      #root .vd-skeleton-card,
      #root .vd-skeleton-circle {
        background-color: #ffffff;
      }
      #root .vd-skeleton-card::after,
      #root .vd-skeleton-circle::after {
        background: linear-gradient(90deg, transparent, rgba(91, 62, 255, 0.18), transparent);
      }
      #root .vd-skeleton-card {
        width: 100%;
        height: 76px;
        margin-top: 12px;
      }
      #root .vd-skeleton-cta {
        width: 220px;
        height: 24px;
        margin-top: 56px;
        border-radius: 8px;
      }
      @media (prefers-reduced-motion: reduce) {
        #root .vd-skeleton::after {
          animation: none;
        }
      }
      @media (prefers-color-scheme: dark) {
        #root .vd-skeleton {
          background-color: rgba(255, 255, 255, 0.1);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="vd-skeleton-page" aria-hidden="true">
        <div class="vd-skeleton vd-skeleton-avatar"></div>
        <div class="vd-skeleton vd-skeleton-title"></div>
        <div class="vd-skeleton vd-skeleton-subtitle"></div>
        <div class="vd-skeleton vd-skeleton-line"></div>
        <div class="vd-skeleton vd-skeleton-line"></div>
        <div class="vd-skeleton-row">
          <div class="vd-skeleton vd-skeleton-circle"></div>
          <div class="vd-skeleton vd-skeleton-circle"></div>
          <div class="vd-skeleton vd-skeleton-circle"></div>
          <div class="vd-skeleton vd-skeleton-circle"></div>
        </div>
        <div class="vd-skeleton vd-skeleton-card"></div>
        <div class="vd-skeleton vd-skeleton-card"></div>
        <div class="vd-skeleton vd-skeleton-cta"></div>
        <div class="vd-skeleton vd-skeleton-card"></div>
        <div class="vd-skeleton vd-skeleton-card"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
